<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Gestión</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            📚 Biblioteca
        </div>
    
        <nav class="sidebar-nav">
            <button class="sidebar-item active">Libros</button>
            <button class="sidebar-item">Estadísticas</button>
            <button class="sidebar-item" id="openCustomTab">Extra</button>
        </nav>
    
        <button class="sidebar-toggle" id="toggleSidebar">☰</button>
    </aside>

    <div class="app">
        <header class="app-header">
            <h1 class="app-title">Gestión de Biblioteca</h1>
        </header>

    <main class="container">

    <!-- Barra de controles -->
    <section class="controls">
        <div class="controls-left">
            <input type="search" class="input" placeholder="Buscar libro..." aria-label="Buscar libro" id="buscador">
            <p class="contador" id="contador"></p>
        </div>

        <div class="controls-right">
            <span class="contador"></span>
            <button class="btn btn-primary" id="addBook">Gestionar libro</button>
        </div>
    </section>

    <!-- Tabla de libros -->
    <section class="table-wrapper">
        <table class="books-table">
            <thead>
                <tr>
                    <th>Portada</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Editorial</th>
                    <th>ISBN</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="libros"></tbody>
        </table>
    </section>

</main>
</div>

<!-- Modal agregar libro -->
<section class="modal" aria-hidden="true" id="manualForm">
    <div class="modal-content">
        <header class="modal-header">
            <h2 id="tituloForm">Agregar libro</h2>
        </header>

        <form class="form" id="añadirLibro">
                
            <!-- ISBN + Buscar -->
            <div class="isbn-search">
                <label class="isbn-field">
                    ISBN
                    <input type="number" min="0" class="input" id="isbnBuscador">
                </label>
            
                <button type="button" class="btn btn-primary isbn-btn" id="btnBuscarISBN">
                    Buscar
                </button>
            </div>
            
            <div id="form-grid" >
                <hr class="form-divider" >
                <!-- Resto del formulario -->
                <div class="form-grid" >
                    <label>
                        Título
                        <input type="text"  id="formTitulo" class="input     manualForm"     placeholder="Titulo" readonly>
                    </label>
                
                    <label>
                        Autor
                        <input type="text"  id="formAutor" class="input  manualForm"  placeholder="Autor"readonly>
                    </label>
                
                    <label>
                        Editorial
                        <input type="text"  class="input manualForm"     id="formEditorial"  placeholder="Editorial"  readonly>
                    </label>
                
                    <label>
                        Portada (URL)
                        <input type="url" class="input  manualForm"  placeholder="URL"id="formUrl"    readonly>
                    </label>
                
                    <label>
                        Estado
                        <select class="select manualForm" id="formEstado" disabled>
                            <option>Disponible</option>
                            <option>Prestado</option>
                        </select>
                    </label>
                    <label>
                        Editar
                        <button type="button" id="btnEditDetail" class="btn btn-secondary">Detalle</button>
                    </label>
                </div>
                <footer class="modal-footer">
                    <button type="button" id="btnDel" class="btn btn-danger">Eliminar</button>
                    <button type="button" id="btnCancel" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </footer>
            </div>
        </form>
        

    </div>
</section>
<section class="modal" aria-hidden="true" id="detailForm">
    <div class="modal-content">
        <header class="modal-header">
            <h2 id="tituloForm">Detalles libro</h2>
        </header>

        <form class="form" id="añadirDetalle">
            <div>
                <label>Título<input type="text"  id="detailTitle" class="input manualForm" placeholder="Titulo" readonly></label>
                <label>Autor<input type="text"  id="detailAuthor" class="input manualForm" placeholder="Autor" readonly></label>
                <hr class="form-divider" >
                <!-- Resto del formulario -->
                <div class="form-grid" >
                    <label>Descripción<textarea type="text"  id="formDescripcion" class="input manualForm" placeholder="Descripción" ></textarea></label>
                    <label>Genero<input type="text"  id="formGenero" class="input manualForm" placeholder="Género" ></label>
                    <label>Idioma<input type="text"  id="formIdioma" class="input manualForm" placeholder="Idioma" ></label>
                    <label>Paginas<input type="text"  id="formPaginas" class="input manualForm" placeholder="Páginas" ></label>
                    <label>Estantería<input type="text"  id="formEstante" class="input manualForm" placeholder="Estantería" ></label>
                    <label>Saga<input type="text"  id="formSaga" class="input manualForm" placeholder="Saga" ></label>
                    <label>Reseña<input type="text"  id="formReseña" class="input manualForm" placeholder="Reseña" ></label>
                    <label>Puntuación<input type="number" min="0" max="5" id="formPuntuacion" class="input manualForm" placeholder="Puntuación" ></label>
                </div>
                <footer class="modal-footer">
                    <button type="button" id="btnDelDetail" class="btn btn-danger">Eliminar</button>
                    <button type="button" id="btnCancelDetail" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </footer>
            </div>
        </form>
        

    </div>
</section>

    <!-- MODAL DETALLE (NUEVO) -->
    <section class="modal" id="bookDetail">
        <div class="modal-content book-modal">
            <button class="close-btn" id="closeDetail">✕</button>

            <div class="book-layout">
                <img src="" class="book-cover-lg" id="detailCover" />

                <div class="book-info">
                    <h2 id="detailTitle">Título</h2>
                    <p class="author" id="detailAuthor">Autor</p>

                    <p class="description" id="detailDesc"></p>

                    <div class="meta-grid">
                        <span><strong>Género:</strong> <span id="detailGenre"></span></span>
                        <span><strong>Idioma:</strong> <span id="detailLang"></span></span>
                        <span><strong>Páginas:</strong> <span id="detailPages"></span></span>
                        <span><strong>Estantería:</strong> <span id="detailShelf"></span></span>
                        <span><strong>Saga:</strong> <span id="detailSaga"></span></span>
                    </div>

                    <div class="review-box">
                        <strong>Reseña</strong>
                        <p id="detailReview"></p>
                    </div>

                    <div class="rating" id="detailRating"></div>
                </div>
            </div>
            <button class="btn btn-primary" id="editDetailBtn">Editar</button>
        </div>
    </section>
</body>
<script src="script.js"></script>

</body>


</html>
